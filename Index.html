<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Местим Всичко ERP</title>
    <!-- CSS: Bootstrap & Google Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #f4f7f6; }
        .sidebar { height: 100vh; background: #1f4e78; color: white; position: fixed; width: 250px; }
        .sidebar a { color: white; text-decoration: none; padding: 15px; display: block; transition: 0.3s; }
        .sidebar a:hover { background: #2c6da3; }
        .content { margin-left: 250px; padding: 20px; }
        .card { border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .status-badge { padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; }
        @media (max-width: 768px) {
            .sidebar { width: 100%; height: auto; position: relative; }
            .content { margin-left: 0; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="p-3 text-center">
            <h4>Местим Всичко</h4>
            <small>ERP Система</small>
        </div>
        <hr>
        <a href="#" onclick="showSection('dashboard')"><i class="fas fa-home me-2"></i> Табло</a>
        <a href="#" onclick="showSection('orders')"><i class="fas fa-truck me-2"></i> Поръчки</a>
        <a href="#" onclick="showSection('employees')"><i class="fas fa-users me-2"></i> Служители</a>
        <a href="#" onclick="showSection('payroll')"><i class="fas fa-euro-sign me-2"></i> Плащания</a>
        <a href="#" onclick="showSection('chat')"><i class="fas fa-comments me-2"></i> Чат</a>
    </div>

    <div class="content">
        <!-- Dashboard Section -->
        <section id="dashboard">
            <h2 class="mb-4">Добре дошли, Админ</h2>
            <div class="row">
                <div class="col-md-3">
                    <div class="card p-3 bg-primary text-white mb-3">
                        <h5>Днешни поръчки</h5>
                        <h2 id="todayOrdersCount">0</h2>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-3 bg-success text-white mb-3">
                        <h5>Активни служители</h5>
                        <h2 id="activeEmpCount">0</h2>
                    </div>
                </div>
            </div>
            
            <div class="card mt-4 p-3">
                <h5>Бърз календар</h5>
                <div id="miniCalendar">Зареждане на график...</div>
            </div>
        </section>

        <!-- Employees Section -->
        <section id="employees" style="display:none;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2>Служители</h2>
                <button class="btn btn-primary" onclick="openEmpModal()"><i class="fas fa-plus"></i> Нов Служител</button>
            </div>
            <div class="card p-3">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Име</th>
                            <th>Роля</th>
                            <th>Ставка (2ч)</th>
                            <th>Статус</th>
                            <th>Действие</th>
                        </tr>
                    </thead>
                    <tbody id="empTableBody">
                        <!-- Данните ще се заредят тук -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Orders Section -->
        <section id="orders" style="display:none;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2>Поръчки</h2>
                <button class="btn btn-success" onclick="openOrderModal()"><i class="fas fa-plus"></i> Нова Поръчка</button>
            </div>
            <div id="orderList">
                <!-- Карти с поръчки -->
            </div>
        </section>
    </div>

    <!-- JS: Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbydPnSP-4WFI-oCSwIkuB79-ApVZutCw8hYa6vAiqOXp-CJk6V0TQPDPo43XrMKfNif-g/exec";

        function showSection(id) {
            document.querySelectorAll('section').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'block';
            if (id === 'employees') loadEmployees();
            if (id === 'orders') loadOrders();
        }

        async function loadEmployees() {
            try {
                const response = await fetch(`${API_URL}?action=getAdminData`);
                const data = await response.json();
                const tbody = document.getElementById('empTableBody');
                tbody.innerHTML = '';

                data.employees.forEach(emp => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${emp.Name}</td>
                            <td>${emp.Phone}</td>
                            <td>${emp.Rate_First_2h_Eur} €</td>
                            <td><span class="status-badge bg-success">${emp.Status}</span></td>
                            <td><button class="btn btn-sm btn-outline-primary">Редакция</button></td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Грешка при зареждане:", error);
            }
        }

        // Първоначално зареждане
        window.onload = () => {
            // Тук можем да добавим проверка за логнат потребител
        };
    </script>
</body>
</html>
