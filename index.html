<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Местим Всичко ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #f4f7f6; }
        .sidebar { height: 100vh; background: #1f4e78; color: white; position: fixed; width: 250px; transition: 0.3s; }
        .sidebar a { color: white; text-decoration: none; padding: 15px; display: block; }
        .sidebar a:hover, .sidebar a.active { background: #2c6da3; }
        .content { margin-left: 250px; padding: 20px; }
        .card { border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .order-card { border-left: 5px solid #1f4e78; transition: 0.2s; }
        .order-card:hover { transform: scale(1.01); }
        @media (max-width: 768px) { .sidebar { width: 0; overflow: hidden; } .content { margin-left: 0; } }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="p-4 text-center"><h4>МЕСТИМ ВСИЧКО</h4></div>
        <a href="#" onclick="showSection('dashboard')"><i class="fas fa-home me-2"></i> Табло</a>
        <a href="#" onclick="showSection('orders')"><i class="fas fa-truck me-2"></i> Поръчки</a>
        <a href="#" onclick="showSection('employees')"><i class="fas fa-users me-2"></i> Служители</a>
        <a href="#" onclick="showSection('chat')"><i class="fas fa-comments me-2"></i> Чат</a>
    </div>

    <div class="content">
        <!-- ORDERS SECTION -->
        <section id="orders" style="display:none;">
            <div class="d-flex justify-content-between mb-4">
                <h2>Управление на поръчки</h2>
                <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#orderModal"><i class="fas fa-plus"></i> Нова поръчка</button>
            </div>
            <div id="orderList" class="row"></div>
        </section>

        <!-- EMPLOYEES SECTION -->
        <section id="employees" style="display:none;">
            <div class="d-flex justify-content-between mb-4">
                <h2>Служители</h2>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#empModal">+ Нов служител</button>
            </div>
            <div class="card p-3"><table class="table"><thead><tr><th>Име</th><th>Телефон</th><th>Статус</th></tr></thead><tbody id="empTableBody"></tbody></table></div>
        </section>
    </div>

    <!-- MODAL: NEW ORDER -->
    <div class="modal fade" id="orderModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-success text-white"><h5>Нова поръчка за местене</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <form id="orderForm">
                        <div class="row">
                            <div class="col-md-6 mb-3"><label>Търсене на клиент (Име/Тел)</label><input type="text" id="clientSearch" class="form-control" placeholder="Започнете да пишете..." required></div>
                            <div class="col-md-6 mb-3"><label>Дата</label><input type="date" name="Date" class="form-control" required></div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3"><label>Начален час</label><input type="time" name="TimeStart" class="form-control" required></div>
                            <div class="col-md-6 mb-3"><label>Очакван край</label><input type="time" name="TimeEnd" class="form-control"></div>
                        </div>
                        <div class="mb-3"><label>Адрес (ОТ)</label><input type="text" name="AddrStart" class="form-control" placeholder="Улица, номер, град" required></div>
                        <div class="mb-3"><label>Адрес (ДО)</label><input type="text" name="AddrEnd" class="form-control" placeholder="Улица, номер, град" required></div>
                        
                        <div class="card p-3 bg-light">
                            <h6>Избор на екип (до 8 души)</h6>
                            <div id="teamCheckboxes" class="row px-2"></div>
                        </div>

                        <div class="row mt-3">
                            <div class="col-md-6"><label>Кола 1 / Шофьор</label><input type="text" name="Vehicle1" class="form-control" placeholder="Рег. номер / Име"></div>
                            <div class="col-md-6"><label>Кола 2 / Шофьор</label><input type="text" name="Vehicle2" class="form-control" placeholder="Рег. номер / Име"></div>
                        </div>
                        <div class="mt-3"><label>Описание / Детайли</label><textarea name="Desc" class="form-control" rows="3"></textarea></div>
                        <button type="submit" class="btn btn-success w-100 mt-4">СЪЗДАЙ ПОРЪЧКА</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbydPnSP-4WFI-oCSwIkuB79-ApVZutCw8hYa6vAiqOXp-CJk6V0TQPDPo43XrMKfNif-g/exec";
        let appData = { employees: [], clients: [], orders: [] };

        async function init() {
            const resp = await fetch(`${API_URL}?action=getAdminData`);
            appData = await resp.json();
            renderEmployees();
            renderOrders();
            renderTeamSelector();
        }

        function showSection(id) {
            document.querySelectorAll('section').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }

        function renderEmployees() {
            const tbody = document.getElementById('empTableBody');
            tbody.innerHTML = appData.employees.map(e => `<tr><td>${e.Name}</td><td>${e.Phone}</td><td>${e.Status}</td></tr>`).join('');
        }

        function renderTeamSelector() {
            const container = document.getElementById('teamCheckboxes');
            container.innerHTML = appData.employees.map(e => `
                <div class="col-md-4 form-check">
                    <input class="form-check-input team-check" type="checkbox" value="${e.ID_Emp}" id="emp_${e.ID_Emp}">
                    <label class="form-check-label" for="emp_${e.ID_Emp}">${e.Name}</label>
                </div>
            `).join('');
        }

        function renderOrders() {
            const container = document.getElementById('orderList');
            container.innerHTML = appData.orders.map(o => `
                <div class="col-md-6">
                    <div class="card p-3 order-card">
                        <div class="d-flex justify-content-between">
                            <span class="badge bg-primary">ID: ${o.ID_Order}</span>
                            <span class="text-muted small">${o.Date} | ${o.Time_Start_Plan}</span>
                        </div>
                        <h5 class="mt-2">${o.Address_Start} <i class="fas fa-arrow-right"></i> ${o.Address_End}</h5>
                        <p class="mb-1 text-truncate">${o.Description}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <small class="text-success fw-bold">${o.Status}</small>
                            <button class="btn btn-sm btn-outline-secondary">Детайли</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('orderForm').onsubmit = async (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const obj = Object.fromEntries(fd);
            obj.action = "addOrder";
            obj.ClientId = "1"; // Засега фиксирано, ще добавим търсенето след малко
            obj.TeamIds = Array.from(document.querySelectorAll('.team-check:checked')).map(cb => cb.value);

            Swal.fire('Записване...');
            await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(obj) });
            Swal.fire('Успех!', 'Поръчката е добавена!', 'success');
            init(); // Опресняване
        };

        window.onload = init;
    </script>
</body>
</html>
