<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mestim Vsichko ERP - Professional</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; }
        .sidebar { height: 100vh; background: #1a3c5a; color: white; position: fixed; width: 250px; z-index: 1000; }
        .sidebar a { color: white; text-decoration: none; padding: 15px 25px; display: block; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .sidebar a:hover { background: #244d73; }
        .content { margin-left: 250px; padding: 30px; min-height: 100vh; }
        #calendar { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); min-height: 700px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .order-card { border-top: 5px solid #1a3c5a; transition: 0.3s; }
        .team-badge { background: #eef2f7; color: #1a3c5a; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; margin: 2px; display: inline-block; border: 1px solid #d1d9e0; }
        .fc-event { cursor: pointer; padding: 3px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="p-4 text-center"><h4 class="fw-bold m-0">МЕСТИМ ВСИЧКО</h4><small>Admin Panel</small></div>
        <a onclick="showSection('dashboard')"><i class="fas fa-calendar-alt me-2"></i> График</a>
        <a onclick="showSection('orders-sec')"><i class="fas fa-truck me-2"></i> Поръчки</a>
        <a onclick="showSection('payroll-sec')"><i class="fas fa-euro-sign me-2"></i> Заплати</a>
        <a onclick="showSection('clients-sec')"><i class="fas fa-users me-2"></i> Клиенти</a>
        <a onclick="showSection('emps-sec')"><i class="fas fa-user-tie me-2"></i> Екип</a>
    </div>

    <div class="content">
        <section id="dashboard">
            <div class="d-flex justify-content-between mb-4"><h2>График</h2><button class="btn btn-success rounded-pill px-4" onclick="openOrderModal()">+ НОВА ПОРЪЧКА</button></div>
            <div id="calendar"></div>
        </section>

        <section id="payroll-sec" style="display:none;">
            <h2>Дължими суми към екипа</h2>
            <div class="card p-3"><table class="table align-middle"><thead><tr><th>Служител</th><th>Неплатени часове</th><th>Сума за изплащане</th><th>Действие</th></tr></thead><tbody id="payrollTable"></tbody></table></div>
        </section>

        <section id="orders-sec" style="display:none;">
            <div class="d-flex justify-content-between mb-4"><h2>Всички Поръчки</h2><input type="text" class="form-control w-50" placeholder="Търси име, телефон или адрес..." onkeyup="filterOrders(this.value)"></div>
            <div id="orderList" class="row"></div>
        </section>

        <section id="clients-sec" style="display:none;">
            <div class="d-flex justify-content-between mb-4"><h2>База Клиенти</h2><button class="btn btn-primary" onclick="openClientModal()">+ НОВ КЛИЕНТ</button></div>
            <div class="card p-3"><table class="table"><thead><tr><th>Име</th><th>Телефон</th><th>Действия</th></tr></thead><tbody id="clientTable"></tbody></table></div>
        </section>

        <section id="emps-sec" style="display:none;">
            <div class="d-flex justify-content-between mb-4"><h2>Екип</h2><button class="btn btn-primary" onclick="openEmpModal()">+ НОВ СЛУЖИТЕЛ</button></div>
            <div class="card p-3"><table class="table"><thead><tr><th>Име</th><th>Email</th><th>Действия</th></tr></thead><tbody id="empTable"></tbody></table></div>
        </section>
    </div>

    <!-- MODAL: ORDER FORM -->
    <div class="modal fade" id="orderModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content p-4 shadow-lg">
        <form id="orderForm">
            <input type="hidden" name="ID_Order" id="o_id">
            <h4 id="o_title" class="mb-4 text-primary">Поръчка</h4>
            <div class="row mb-3">
                <div class="col-md-6"><label>Клиент</label><input list="clientData" id="o_client" class="form-control" required placeholder="Търси име..."><datalist id="clientData"></datalist></div>
                <div class="col-md-6"><label>Услуга</label><select name="Service" id="o_service" class="form-select" required></select></div>
            </div>
            <div class="row mb-3">
                <div class="col-md-4"><label>Дата</label><input type="date" name="Date" id="o_date" class="form-control" required></div>
                <div class="col-md-4"><label>Начало</label><input type="time" name="TimeStart" id="o_start" class="form-control" required></div>
                <div class="col-md-4"><label>Край (очакван)</label><input type="time" name="TimeEnd" id="o_end" class="form-control"></div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6"><label>ОТ Адрес</label><input type="text" name="AddrStart" id="o_addr1" class="form-control" required></div>
                <div class="col-md-6"><label>ДО Адрес</label><input type="text" name="AddrEnd" id="o_addr2" class="form-control" required></div>
            </div>
            <div class="card p-3 bg-light mb-3"><h6>Екип:</h6><div id="teamPick" class="row"></div></div>
            <textarea name="Desc" id="o_desc" class="form-control mb-3" placeholder="Бележки..."></textarea>
            <button type="submit" class="btn btn-success w-100 py-3 fw-bold">ЗАПАЗИ</button>
        </form>
    </div></div></div>

    <!-- OTHER MODALS (Client, Emp) -->
    <div class="modal fade" id="clientModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content p-4"><form id="clientForm"><input type="hidden" name="ID_Client" id="c_id"><h5 id="c_title">Клиент</h5><input type="text" name="Name" id="c_name" class="form-control mb-2" required placeholder="Име"><input type="text" name="Phone" id="c_phone" class="form-control mb-2" required placeholder="Телефон"><input type="text" name="Address" id="c_addr" class="form-control mb-2" placeholder="Адрес"><button type="submit" class="btn btn-primary w-100">Запази</button></form></div></div></div>
    <div class="modal fade" id="empModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content p-4"><form id="empForm"><input type="hidden" name="ID_Emp" id="e_id"><h5 id="e_title">Служител</h5><input type="text" name="Name" id="e_name" class="form-control mb-2" required placeholder="Име"><input type="email" name="Email" id="e_email" class="form-control mb-2" required placeholder="Email"><input type="text" name="Phone" id="e_phone" class="form-control mb-2" placeholder="Телефон"><button type="submit" class="btn btn-primary w-100">Запази</button></form></div></div></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/bg.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwA-q2ce8R0tB3EusmgR8Uy_M0W2dfAQLrVfb96CDLg8-56ZvNU9LMLtsExEgZ_YfNRpw/exec";
        let appData = { employees: [], clients: [], orders: [], assignments: [], services: [] };
        let calendar;

        async function init() {
            Swal.fire({title: 'Зареждане...', didOpen: () => Swal.showLoading()});
            const resp = await fetch(API_URL + "?action=getAdminData");
            appData = await resp.json();
            renderAll();
            Swal.close();
        }

        function renderAll() {
            // CALENDAR
            if (calendar) calendar.destroy();
            calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
                initialView: 'dayGridMonth', locale: 'bg',
                headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek' },
                events: appData.orders.map(o => {
                    const client = appData.clients.find(c => c.Name.trim() === o.Client_ID.trim());
                    const phone = client ? client.Phone : 'Няма тел.';
                    const teamNames = appData.assignments.filter(a => a.Order_ID == o.ID_Order).map(a => appData.employees.find(e => e.ID_Emp == a.Emp_ID)?.Name).join(', ');
                    return {
                        title: `${o.Time_Start_Plan} | ${o.Service} - ${o.Client_ID} (${phone})`,
                        start: `${o.Date}T${o.Time_Start_Plan}`,
                        end: o.Time_End_Plan ? `${o.Date}T${o.Time_End_Plan}` : null,
                        color: '#1a3c5a',
                        extendedProps: { ...o, Phone: phone, Team: teamNames }
                    };
                }),
                eventClick: (info) => showOrderDetails(info.event.extendedProps)
            });
            calendar.render();

            // ORDER CARDS
            document.getElementById('orderList').innerHTML = appData.orders.sort((a,b) => new Date(b.Date) - new Date(a.Date)).map(o => {
                const client = appData.clients.find(c => c.Name.trim() === o.Client_ID.trim());
                const phone = client ? client.Phone : 'Няма тел.';
                const team = appData.assignments.filter(a => a.Order_ID == o.ID_Order).map(a => `<span class="team-badge">${appData.employees.find(e => e.ID_Emp == a.Emp_ID)?.Name}</span>`).join('');
                return `
                <div class="col-md-6 mb-3 order-item" data-search="${o.Client_ID} ${phone} ${o.Address_Start}">
                    <div class="card p-3 order-card h-100 shadow-sm">
                        <div class="d-flex justify-content-between align-items-center mb-2"><span class="badge bg-primary">${o.Service}</span><button class="btn btn-sm btn-outline-primary shadow-sm" onclick='editOrder(${JSON.stringify(o)})'><i class="fas fa-edit"></i></button></div>
                        <h5 class="text-primary mb-0">${o.Client_ID}</h5>
                        <div class="text-muted small mb-2 fw-bold"><i class="fas fa-phone-alt me-1 text-danger"></i> ${phone}</div>
                        <p class="small mb-1 text-dark"><b>ОТ:</b> ${o.Address_Start}<br><b>ДО:</b> ${o.Address_End}</p>
                        <div class="mb-2">${team}</div>
                        <div class="small text-secondary border-top pt-1 italic text-truncate">${o.Description || 'Няма бележки'}</div>
                    </div>
                </div>`;
            }).join('');

            // PAYROLL
            document.getElementById('payrollTable').innerHTML = appData.employees.map(e => `
                <tr><td><b>${e.Name}</b></td><td>${e.Total_Hours} ч.</td><td class="text-success fw-bold">${e.Total_Unpaid_Eur} €</td><td><button class="btn btn-sm btn-success px-3 rounded-pill">Плати</button></td></tr>
            `).join('');

            // DROPDOWNS & LISTS
            document.getElementById('clientData').innerHTML = appData.clients.map(c => `<option value="${c.Name}"></option>`).join('');
            document.getElementById('o_service').innerHTML = appData.services.map(s => `<option value="${s.trim()}">${s.trim()}</option>`).join('');
            document.getElementById('teamPick').innerHTML = appData.employees.map(e => `<div class="col-4 small mb-1"><input type="checkbox" class="team-chk" value="${e.ID_Emp}" id="t_${e.ID_Emp}"> <label for="t_${e.ID_Emp}">${e.Name}</label></div>`).join('');
            document.getElementById('clientTable').innerHTML = appData.clients.map(c => `<tr><td><b>${c.Name}</b></td><td>${c.Phone}</td><td><button class="btn btn-sm btn-light border shadow-sm" onclick='editClient(${JSON.stringify(c)})'><i class="fas fa-edit"></i></button></td></tr>`).join('');
            document.getElementById('empTable').innerHTML = appData.employees.map(e => `<tr><td><b>${e.Name}</b></td><td>${e.Email}</td><td><button class="btn btn-sm btn-light border shadow-sm" onclick='editEmp(${JSON.stringify(e)})'><i class="fas fa-edit"></i></button></td></tr>`).join('');
        }

        function showOrderDetails(o) {
            Swal.fire({
                title: o.Service,
                html: `<div class="text-start small"><b>Клиент:</b> ${o.Client_ID} (${o.Phone})<br><b>Адрес:</b> ${o.Address_Start} &rarr; ${o.Address_End}<br><b>Екип:</b> ${o.Team}<br><b>Описание:</b> ${o.Description || '-'}</div>`,
                confirmButtonText: 'Редактирай',
                showCancelButton: true,
                cancelButtonText: 'Затвори'
            }).then(r => { if(r.isConfirmed) editOrder(o); });
        }

        function editOrder(o) {
            document.getElementById('orderForm').reset();
            document.getElementById('o_id').value = o.ID_Order;
            document.getElementById('o_client').value = o.Client_ID;
            document.getElementById('o_service').value = o.Service;
            document.getElementById('o_date').value = o.Date;
            document.getElementById('o_start').value = o.Time_Start_Plan;
            document.getElementById('o_end').value = o.Time_End_Plan;
            document.getElementById('o_addr1').value = o.Address_Start;
            document.getElementById('o_addr2').value = o.Address_End;
            document.getElementById('o_desc').value = o.Description;
            const currentAssigns = appData.assignments.filter(a => a.Order_ID == o.ID_Order).map(a => a.Emp_ID.toString());
            document.querySelectorAll('.team-chk').forEach(cb => cb.checked = currentAssigns.includes(cb.value.toString()));
            new bootstrap.Modal(document.getElementById('orderModal')).show();
        }

        function editClient(c) {
            document.getElementById('c_id').value = c.ID_Client;
            document.getElementById('c_name').value = c.Name;
            document.getElementById('c_phone').value = c.Phone;
            document.getElementById('c_addr').value = c.Address_Main;
            document.getElementById('c_notes').value = c.Notes;
            new bootstrap.Modal(document.getElementById('clientModal')).show();
        }

        function editEmp(e) {
            document.getElementById('e_id').value = e.ID_Emp;
            document.getElementById('e_name').value = e.Name;
            document.getElementById('e_email').value = e.Email;
            document.getElementById('e_phone').value = e.Phone;
            new bootstrap.Modal(document.getElementById('empModal')).show();
        }

        function openOrderModal() { document.getElementById('orderForm').reset(); document.getElementById('o_id').value = ""; new bootstrap.Modal(document.getElementById('orderModal')).show(); }
        function openClientModal() { document.getElementById('clientForm').reset(); document.getElementById('c_id').value = ""; new bootstrap.Modal(document.getElementById('clientModal')).show(); }
        function openEmpModal() { document.getElementById('empForm').reset(); document.getElementById('e_id').value = ""; new bootstrap.Modal(document.getElementById('empModal')).show(); }

        document.getElementById('orderForm').onsubmit = (e) => { e.preventDefault(); const data = Object.fromEntries(new FormData(e.target)); data.action = data.ID_Order ? "editOrder" : "addOrder"; data.ClientName = document.getElementById('o_client').value; data.TeamIds = Array.from(document.querySelectorAll('.team-chk:checked')).map(c => c.value); send(data); };
        document.getElementById('clientForm').onsubmit = (e) => { e.preventDefault(); const data = Object.fromEntries(new FormData(e.target)); data.action = data.ID_Client ? "editClient" : "addClient"; send(data); };
        document.getElementById('empForm').onsubmit = (e) => { e.preventDefault(); const data = Object.fromEntries(new FormData(e.target)); data.action = data.ID_Emp ? "editEmployee" : "addEmployee"; send(data); };

        async function send(data) {
            Swal.fire({title:'Запазване...', didOpen:()=>Swal.showLoading()});
            await fetch(API_URL, {method:'POST', mode:'no-cors', body:JSON.stringify(data)});
            location.reload();
        }

        function showSection(id) {
            document.querySelectorAll('section').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'block';
            if(calendar) { calendar.render(); calendar.updateSize(); }
        }

        function filterOrders(v) {
            const val = v.toLowerCase();
            document.querySelectorAll('.order-item').forEach(el => el.style.display = el.getAttribute('data-search').toLowerCase().includes(val) ? 'block' : 'none');
        }

        window.onload = init;
    </script>
</body>
</html>
