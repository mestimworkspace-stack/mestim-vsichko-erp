<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mestim Vsichko ERP v5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; }
        .sidebar { height: 100vh; background: #1a3c5a; color: white; position: fixed; width: 250px; z-index: 1000; }
        .sidebar a { color: white; text-decoration: none; padding: 15px 25px; display: block; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .sidebar a:hover { background: #244d73; }
        .content { margin-left: 250px; padding: 30px; min-height: 100vh; }
        #calendar { background: white; padding: 20px; border-radius: 12px; height: 700px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .fc-event { cursor: pointer; padding: 2px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="p-4"><h4 class="fw-bold text-center">МЕСТИМ ВСИЧКО</h4></div>
        <a onclick="showSection('dashboard')"><i class="fas fa-calendar-alt me-2"></i> График</a>
        <a onclick="showSection('orders-sec')"><i class="fas fa-truck me-2"></i> Поръчки</a>
        <a onclick="showSection('clients-sec')"><i class="fas fa-address-book me-2"></i> Клиенти</a>
        <a onclick="showSection('emps-sec')"><i class="fas fa-users me-2"></i> Екип</a>
    </div>

    <div class="content">
        <!-- CALENDAR -->
        <section id="dashboard">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Месечен график</h2>
                <button class="btn btn-success rounded-pill px-4" onclick="openOrderModal()">+ НОВА ПОРЪЧКА</button>
            </div>
            <div id="calendar"></div>
        </section>

        <!-- ORDERS LIST -->
        <section id="orders-sec" style="display:none;">
            <div class="d-flex justify-content-between mb-4">
                <h2>Всички поръчки</h2>
                <input type="text" id="orderSearch" class="form-control w-50" placeholder="Търси клиент или адрес..." onkeyup="filterOrders()">
            </div>
            <div id="orderList" class="row"></div>
        </section>

        <!-- CLIENTS -->
        <section id="clients-sec" style="display:none;">
            <div class="d-flex justify-content-between mb-4"><h2>Клиенти</h2><button class="btn btn-primary" onclick="new bootstrap.Modal(document.getElementById('clientModal')).show()">+ Нов Клиент</button></div>
            <div class="card p-3"><table class="table"><thead><tr><th>Име</th><th>Телефон</th><th>Адрес</th></tr></thead><tbody id="clientTable"></tbody></table></div>
        </section>

        <!-- EMPLOYEES -->
        <section id="emps-sec" style="display:none;">
            <div class="d-flex justify-content-between mb-4"><h2>Служители</h2><button class="btn btn-primary" onclick="new bootstrap.Modal(document.getElementById('empModal')).show()">+ Нов Служител</button></div>
            <div class="card p-3"><table class="table"><thead><tr><th>Име</th><th>Имейл</th></tr></thead><tbody id="empTable"></tbody></table></div>
        </section>
    </div>

    <!-- MODAL: NEW ORDER -->
    <div class="modal fade" id="orderModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content p-4">
        <form id="orderForm">
            <h4 class="mb-4 text-primary">Създаване на поръчка</h4>
            <div class="row mb-3">
                <div class="col-md-6"><label>Търси Клиент</label><input list="clientData" id="clientInp" class="form-control" placeholder="Напишете име..." required><datalist id="clientData"></datalist></div>
                <div class="col-md-6"><label>Дата</label><input type="date" name="Date" class="form-control" required></div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6"><label>Начало</label><input type="time" name="TimeStart" class="form-control" required></div>
                <div class="col-md-6"><label>Край</label><input type="time" name="TimeEnd" class="form-control"></div>
            </div>
            <input type="text" name="AddrStart" class="form-control mb-2" placeholder="ОТ Адрес" required>
            <input type="text" name="AddrEnd" class="form-control mb-3" placeholder="ДО Адрес" required>
            <div class="card p-3 bg-light mb-3"><h6>Избери екип:</h6><div id="teamPick" class="row"></div></div>
            <textarea name="Desc" class="form-control mb-3" placeholder="Допълнителни бележки..."></textarea>
            <button type="submit" class="btn btn-success w-100 py-2">ЗАПИШИ В ГРАФИКА</button>
        </form>
    </div></div></div>

    <!-- MODALS: EMP & CLIENT -->
    <div class="modal fade" id="empModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content p-4"><form id="empForm"><h5>Нов служител</h5><input type="text" name="Name" class="form-control mb-2" required placeholder="Име"><input type="email" name="Email" class="form-control mb-2" required placeholder="Email"><button type="submit" class="btn btn-primary w-100">Запази</button></form></div></div></div>
    <div class="modal fade" id="clientModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content p-4"><form id="clientForm"><h5>Нов клиент</h5><input type="text" name="Name" class="form-control mb-2" required placeholder="Име"><input type="text" name="Phone" class="form-control mb-2" required placeholder="Телефон"><input type="text" name="Address" class="form-control mb-2" placeholder="Адрес"><button type="submit" class="btn btn-primary w-100">Запази</button></form></div></div></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/bg.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwA-q2ce8R0tB3EusmgR8Uy_M0W2dfAQLrVfb96CDLg8-56ZvNU9LMLtsExEgZ_YfNRpw/exec";
        let appData = { employees: [], clients: [], orders: [] };
        let calendar;

        async function init() {
            try {
                const resp = await fetch(`${API_URL}?action=getAdminData`);
                appData = await resp.json();
                renderAll();
            } catch (e) { console.error("Load error:", e); }
        }

        function showSection(id) {
            document.querySelectorAll('section').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'block';
            if(id === 'dashboard' && calendar) { calendar.render(); calendar.updateSize(); }
        }

        function renderAll() {
            // Employees Table
            document.getElementById('empTable').innerHTML = (appData.employees || []).map(e => `<tr><td>${e.Name}</td><td>${e.Email}</td></tr>`).join('');
            // Clients Table
            document.getElementById('clientTable').innerHTML = (appData.clients || []).map(c => `<tr><td>${c.Name}</td><td>${c.Phone}</td><td>${c.Address_Main}</td></tr>`).join('');
            // Orders Cards
            document.getElementById('orderList').innerHTML = (appData.orders || []).sort((a,b) => new Date(b.Date) - new Date(a.Date)).map(o => `
                <div class="col-md-6 order-card-item" data-search="${o.Client_ID} ${o.Address_Start}">
                    <div class="card p-3 border-start border-primary border-4">
                        <div class="d-flex justify-content-between mb-2"><b>${o.Date} | ${o.Time_Start_Plan}</b><span class="badge bg-light text-dark">#${o.ID_Order}</span></div>
                        <h5 class="text-primary mb-1">${o.Client_ID}</h5>
                        <small class="text-muted">ОТ: ${o.Address_Start}<br>ДО: ${o.Address_End}</small>
                    </div>
                </div>
            `).join('');
            // Team Selection
            document.getElementById('teamPick').innerHTML = (appData.employees || []).map(e => `<div class="col-6 mb-1 small"><input type="checkbox" class="team-chk" value="${e.ID_Emp}"> ${e.Name}</div>`).join('');
            // Client Datalist
            document.getElementById('clientData').innerHTML = (appData.clients || []).map(c => `<option value="${c.Name}"></option>`).join('');
            
            initCalendar();
        }

        function initCalendar() {
            const el = document.getElementById('calendar');
            if (calendar) calendar.destroy();
            calendar = new FullCalendar.Calendar(el, {
                initialView: 'dayGridMonth',
                locale: 'bg',
                headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,timeGridDay' },
                events: (appData.orders || []).map(o => ({
                    title: `${o.Time_Start_Plan} | ${o.Client_ID}`,
                    start: `${o.Date}T${o.Time_Start_Plan}`,
                    end: o.Time_End_Plan ? `${o.Date}T${o.Time_End_Plan}` : null,
                    color: '#1a3c5a'
                })),
                eventClick: (info) => Swal.fire('Детайли', info.event.title, 'info')
            });
            calendar.render();
        }

        function filterOrders() {
            const val = document.getElementById('orderSearch').value.toLowerCase();
            document.querySelectorAll('.order-card-item').forEach(el => el.style.display = el.getAttribute('data-search').toLowerCase().includes(val) ? 'block' : 'none');
        }

        function openOrderModal() { new bootstrap.Modal(document.getElementById('orderModal')).show(); }

        document.getElementById('orderForm').onsubmit = async (e) => {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(e.target));
            data.action = "addOrder";
            data.ClientName = document.getElementById('clientInp').value;
            data.TeamIds = Array.from(document.querySelectorAll('.team-chk:checked')).map(c => c.value);
            
            Swal.fire({title:'Записване...', didOpen:()=>Swal.showLoading()});
            await fetch(API_URL, {method:'POST', mode:'no-cors', body:JSON.stringify(data)});
            Swal.fire('Успех!','Поръчката е добавена','success').then(()=>location.reload());
        };

        // Standard forms
        document.getElementById('empForm').onsubmit = (e) => handleForm(e, "addEmployee");
        document.getElementById('clientForm').onsubmit = (e) => handleForm(e, "addClient");

        async function handleForm(e, action) {
            e.preventDefault();
            const data = {...Object.fromEntries(new FormData(e.target)), action};
            Swal.fire({title:'Записване...', didOpen:()=>Swal.showLoading()});
            await fetch(API_URL, {method:'POST', mode:'no-cors', body:JSON.stringify(data)});
            location.reload();
        }

        window.onload = init;
    </script>
</body>
</html>
