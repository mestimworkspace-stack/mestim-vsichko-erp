<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Местим Всичко ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #f4f7f6; margin: 0; }
        .sidebar { height: 100vh; background: #1f4e78; color: white; position: fixed; width: 250px; z-index: 100; transition: 0.3s; }
        .sidebar a { color: white; text-decoration: none; padding: 15px; display: block; border-bottom: 1px solid rgba(255,255,255,0.1); cursor: pointer; }
        .sidebar a:hover { background: #2c6da3; }
        .content { margin-left: 250px; padding: 30px; min-height: 100vh; }
        .card { border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; align-items: center; justify-content: center; z-index: 1000; }
        @media (max-width: 768px) { .sidebar { width: 0; overflow: hidden; } .content { margin-left: 0; } }
    </style>
</head>
<body>

    <div id="loader"><div><i class="fas fa-spinner fa-spin fa-3x text-primary"></i><br>Свързване с базата...</div></div>

    <div class="sidebar">
        <div class="p-4 text-center"><h4>МЕСТИМ ВСИЧКО</h4><small>Админ Панел</small></div>
        <a onclick="showSection('dashboard')"><i class="fas fa-home me-2"></i> Табло</a>
        <a onclick="showSection('orders')"><i class="fas fa-truck me-2"></i> Поръчки</a>
        <a onclick="showSection('employees')"><i class="fas fa-users me-2"></i> Служители</a>
    </div>

    <div class="content">
        <!-- DASHBOARD -->
        <section id="dashboard">
            <h2>Табло за управление</h2>
            <div class="row mt-4">
                <div class="col-md-4"><div class="card p-4 text-center"><h5>Поръчки</h5><h2 id="countOrders">0</h2></div></div>
                <div class="col-md-4"><div class="card p-4 text-center"><h5>Служители</h5><h2 id="countEmp">0</h2></div></div>
            </div>
            <div class="alert alert-primary mt-4">Добре дошли! Използвайте менюто за добавяне на служители и поръчки.</div>
        </section>

        <!-- EMPLOYEES -->
        <section id="employees" style="display:none;">
            <div class="d-flex justify-content-between mb-4">
                <h2>Служители</h2>
                <button class="btn btn-primary" onclick="showModal('empModal')">+ Нов служител</button>
            </div>
            <div class="card p-3">
                <table class="table table-hover">
                    <thead><tr><th>Име</th><th>Телефон</th><th>Статус</th></tr></thead>
                    <tbody id="empTableBody"></tbody>
                </table>
            </div>
        </section>

        <!-- ORDERS -->
        <section id="orders" style="display:none;">
            <div class="d-flex justify-content-between mb-4">
                <h2>Поръчки</h2>
                <button class="btn btn-success" onclick="showModal('orderModal')">+ Нова поръчка</button>
            </div>
            <div id="orderList" class="row"></div>
        </section>
    </div>

    <!-- MODAL: NEW EMPLOYEE -->
    <div class="modal fade" id="empModal" tabindex="-1">
        <div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5>Добавяне на служител</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body"><form id="empForm">
            <input type="text" name="Name" class="form-control mb-2" placeholder="Име" required>
            <input type="email" name="Email" class="form-control mb-2" placeholder="Google Email" required>
            <input type="text" name="Phone" class="form-control mb-2" placeholder="Телефон">
            <div class="row"><div class="col"><input type="number" name="Rate2h" class="form-control" placeholder="2ч (€)" required></div>
            <div class="col"><input type="number" step="0.01" name="RateMin" class="form-control" placeholder="Мин (€)" required></div></div>
            <button type="submit" class="btn btn-primary w-100 mt-3">Запази служител</button>
        </form></div></div></div>
    </div>

    <!-- MODAL: NEW ORDER -->
    <div class="modal fade" id="orderModal" tabindex="-1">
        <div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header bg-success text-white"><h5>Нова поръчка</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body"><form id="orderForm">
            <div class="row mb-2"><div class="col"><label>Име на клиент</label><input type="text" name="ClientName" class="form-control" required></div>
            <div class="col"><label>Дата</label><input type="date" name="Date" class="form-control" required></div></div>
            <div class="row mb-2"><div class="col"><label>Час От</label><input type="time" name="TimeStart" class="form-control"></div>
            <div class="col"><label>Час До</label><input type="time" name="TimeEnd" class="form-control"></div></div>
            <input type="text" name="AddrStart" class="form-control mb-2" placeholder="Адрес ОТ" required>
            <input type="text" name="AddrEnd" class="form-control mb-2" placeholder="Адрес ДО" required>
            <div class="card p-2 bg-light"><h6>Избор на екип:</h6><div id="teamSelector" class="row p-2"></div></div>
            <textarea name="Desc" class="form-control mt-2" placeholder="Описание/Бележки"></textarea>
            <button type="submit" class="btn btn-success w-100 mt-3">ЗАПИШИ ПОРЪЧКА</button>
        </form></div></div></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwA-q2ce8R0tB3EusmgR8Uy_M0W2dfAQLrVfb96CDLg8-56ZvNU9LMLtsExEgZ_YfNRpw/exec";
        let appData = { employees: [], orders: [] };

        async function init() {
            try {
                const response = await fetch(`${API_URL}?action=getAdminData`);
                const data = await response.json();
                appData.employees = data.employees || [];
                appData.orders = data.orders || [];
                
                renderEmployees();
                renderOrders();
                renderTeamSelector();
                
                document.getElementById('loader').style.display = 'none';
            } catch (err) {
                document.getElementById('loader').innerHTML = `<div class="text-danger p-4 text-center"><b>Грешка!</b><br>API не отговаря.<br><button class="btn btn-sm btn-outline-dark mt-2" onclick="location.reload()">Повторен опит</button></div>`;
            }
        }

        function showSection(id) {
            document.querySelectorAll('section').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }

        function showModal(id) {
            new bootstrap.Modal(document.getElementById(id)).show();
        }

        function renderEmployees() {
            const tbody = document.getElementById('empTableBody');
            if (appData.employees.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted">Няма регистрирани служители</td></tr>';
            } else {
                tbody.innerHTML = appData.employees.map(e => `<tr><td>${e.Name}</td><td>${e.Phone || '---'}</td><td>${e.Status}</td></tr>`).join('');
            }
            document.getElementById('countEmp').innerText = appData.employees.length;
        }

        function renderTeamSelector() {
            const container = document.getElementById('teamSelector');
            if (appData.employees.length === 0) {
                container.innerHTML = '<div class="col-12 text-muted small">Първо добавете служители от меню "Служители"</div>';
            } else {
                container.innerHTML = appData.employees.map(e => `
                    <div class="col-md-6"><div class="form-check">
                        <input class="form-check-input team-check" type="checkbox" value="${e.ID_Emp}" id="chk_${e.ID_Emp}">
                        <label class="form-check-label small">${e.Name}</label>
                    </div></div>
                `).join('');
            }
        }

        function renderOrders() {
            const container = document.getElementById('orderList');
            if (appData.orders.length === 0) {
                container.innerHTML = '<div class="col-12 text-center p-5 text-muted">В момента няма активни поръчки.</div>';
            } else {
                container.innerHTML = appData.orders.map(o => `
                    <div class="col-md-6"><div class="card p-3 border-start border-primary border-4">
                        <div class="d-flex justify-content-between"><small class="badge bg-secondary">#${o.ID_Order}</small><small>${o.Date}</small></div>
                        <h6 class="mt-2 text-primary text-truncate">${o.Address_Start}</h6>
                        <small class="text-muted">${o.Description || 'Без описание'}</small>
                    </div></div>
                `).join('');
            }
            document.getElementById('countOrders').innerText = appData.orders.length;
        }

        document.getElementById('empForm').onsubmit = async (e) => {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(e.target));
            data.action = "addEmployee";
            await sendData(data);
        };

        document.getElementById('orderForm').onsubmit = async (e) => {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(e.target));
            data.action = "addOrder";
            data.TeamIds = Array.from(document.querySelectorAll('.team-check:checked')).map(c => c.value);
            await sendData(data);
        };

        async function sendData(data) {
            Swal.fire({ title: 'Записване...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
                await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
                Swal.fire('Успех!', 'Записът е направен успешно.', 'success').then(() => location.reload());
            } catch (err) {
                Swal.fire('Грешка!', 'Възникна проблем при записа.', 'error');
            }
        }

        window.onload = init;
    </script>
</body>
</html>
