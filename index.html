<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mestim Vsichko ERP v7</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; }
        .sidebar { height: 100vh; background: #1a3c5a; color: white; position: fixed; width: 250px; z-index: 1000; }
        .sidebar a { color: white; text-decoration: none; padding: 15px 25px; display: block; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .sidebar a:hover { background: #244d73; }
        .content { margin-left: 250px; padding: 30px; min-height: 100vh; }
        #calendar { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); min-height: 700px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .order-card { border-top: 5px solid #1a3c5a; }
        .team-badge { background: #eef2f7; color: #1a3c5a; padding: 3px 8px; border-radius: 15px; font-size: 0.7rem; font-weight: bold; margin: 2px; display: inline-block; border: 1px solid #d1d9e0; }
        .fc-event { cursor: pointer; padding: 3px; font-size: 0.85rem; border: none !important; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="p-4 text-center text-white"><h4 class="fw-bold m-0">МЕСТИМ ВСИЧКО</h4><small>ERP v3.0</small></div>
        <a onclick="showSection('dashboard')"><i class="fas fa-calendar-alt me-2"></i> График</a>
        <a onclick="showSection('orders-sec')"><i class="fas fa-truck me-2"></i> Поръчки</a>
        <a onclick="showSection('clients-sec')"><i class="fas fa-users me-2"></i> Клиенти</a>
        <a onclick="showSection('emps-sec')"><i class="fas fa-user-friends me-2"></i> Екип</a>
    </div>

    <div class="content">
        <section id="dashboard">
            <div class="d-flex justify-content-between mb-4"><h2>График на дейностите</h2><button class="btn btn-success rounded-pill px-4 shadow-sm" onclick="openOrderModal()">+ НОВА ПОРЪЧКА</button></div>
            <div id="calendar"></div>
        </section>

        <section id="orders-sec" style="display:none;">
            <div class="d-flex justify-content-between mb-4"><h2>Списък Поръчки</h2><input type="text" class="form-control w-50" placeholder="Търси..." onkeyup="filterOrders(this.value)"></div>
            <div id="orderList" class="row"></div>
        </section>

        <section id="clients-sec" style="display:none;">
            <div class="d-flex justify-content-between mb-4"><h2>Клиенти</h2><button class="btn btn-primary shadow-sm" onclick="openClientModal()">+ НОВ КЛИЕНТ</button></div>
            <div class="card p-3"><table class="table"><thead><tr><th>Име</th><th>Телефон</th><th>Действия</th></tr></thead><tbody id="clientTable"></tbody></table></div>
        </section>

        <section id="emps-sec" style="display:none;">
            <div class="d-flex justify-content-between mb-4"><h2>Екип</h2><button class="btn btn-primary shadow-sm" onclick="openEmpModal()">+ НОВ СЛУЖИТЕЛ</button></div>
            <div class="card p-3"><table class="table"><thead><tr><th>Име</th><th>Email</th><th>Действия</th></tr></thead><tbody id="empTable"></tbody></table></div>
        </section>
    </div>

    <!-- MODAL: ORDER FORM -->
    <div class="modal fade" id="orderModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content p-4 shadow-lg">
        <form id="orderForm">
            <input type="hidden" name="ID_Order" id="o_id">
            <h4 id="o_title" class="mb-4 text-primary">Поръчка</h4>
            <div class="row mb-3">
                <div class="col-md-6"><label>Клиент</label><input list="clientData" id="o_client" class="form-control" required placeholder="Име..."><datalist id="clientData"></datalist></div>
                <div class="col-md-6"><label>Услуга</label><select name="Service" id="o_service" class="form-select" required></select></div>
            </div>
            <div class="row mb-3">
                <div class="col-md-4"><label>Дата</label><input type="date" name="Date" id="o_date" class="form-control" required></div>
                <div class="col-md-4"><label>Начало</label><input type="time" name="TimeStart" id="o_start" class="form-control" required></div>
                <div class="col-md-4"><label>Край (прогнозно)</label><input type="time" name="TimeEnd" id="o_end" class="form-control"></div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6"><label>ОТ Адрес</label><input type="text" name="AddrStart" id="o_addr1" class="form-control" required></div>
                <div class="col-md-6"><label>ДО Адрес</label><input type="text" name="AddrEnd" id="o_addr2" class="form-control" required></div>
            </div>
            <div class="card p-3 bg-light mb-3"><h6>Екип за изпълнение:</h6><div id="teamPick" class="row"></div></div>
            <textarea name="Desc" id="o_desc" class="form-control mb-3" placeholder="Описание/Бележки..."></textarea>
            <button type="submit" class="btn btn-success w-100 py-3 fw-bold">ЗАПАЗИ</button>
        </form>
    </div></div></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/bg.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwA-q2ce8R0tB3EusmgR8Uy_M0W2dfAQLrVfb96CDLg8-56ZvNU9LMLtsExEgZ_YfNRpw/exec";
        let appData = { employees: [], clients: [], orders: [], assignments: [], services: [] };
        let calendar;

        async function init() {
            Swal.fire({title: 'Зареждане...', didOpen: () => Swal.showLoading()});
            try {
                const resp = await fetch(API_URL + "?action=getAdminData");
                appData = await resp.json();
                renderAll();
                Swal.close();
            } catch(e) { Swal.fire('Error', 'Базата данни не отговаря', 'error'); }
        }

        function renderAll() {
            // CALENDAR
            if (calendar) calendar.destroy();
            calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
                initialView: 'dayGridMonth', locale: 'bg',
                headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,timeGridDay' },
                events: appData.orders.map(o => {
                    const client = appData.clients.find(c => c.Name.trim() === o.Client_ID.trim());
                    const phone = client ? client.Phone : 'Няма тел.';
                    const team = appData.assignments.filter(a => a.Order_ID == o.ID_Order).map(a => appData.employees.find(e => e.ID_Emp == a.Emp_ID)?.Name).join(', ');
                    return {
                        title: `${o.Time_Start_Plan} | ${o.Service} - ${o.Client_ID} (${phone})`,
                        start: `${o.Date}T${o.Time_Start_Plan}`,
                        end: o.Time_End_Plan ? `${o.Date}T${o.Time_End_Plan}` : null,
                        color: '#1a3c5a',
                        extendedProps: { ...o, phone, team }
                    };
                }),
                eventClick: (info) => showOrderDetails(info.event.extendedProps)
            });
            calendar.render();

            // ORDER CARDS
            document.getElementById('orderList').innerHTML = appData.orders.sort((a,b) => new Date(b.Date) - new Date(a.Date)).map(o => {
                const client = appData.clients.find(c => c.Name.trim() === o.Client_ID.trim());
                const phone = client ? client.Phone : 'Няма тел.';
                const team = appData.assignments.filter(a => a.Order_ID == o.ID_Order).map(a => appData.employees.find(e => e.ID_Emp == a.Emp_ID)?.Name).map(name => `<span class="team-badge">${name}</span>`).join('');
                return `
                <div class="col-md-6 mb-3 order-item" data-search="${o.Client_ID} ${phone} ${o.Address_Start}">
                    <div class="card p-3 order-card h-100 shadow-sm">
                        <div class="d-flex justify-content-between align-items-center mb-2"><span class="badge bg-primary">${o.Service}</span><button class="btn btn-sm btn-outline-primary" onclick='editOrder(${JSON.stringify(o)})'><i class="fas fa-edit"></i></button></div>
                        <h5 class="mb-0 text-primary">${o.Client_ID}</h5>
                        <div class="text-muted small mb-2 fw-bold"><i class="fas fa-phone-alt me-1 text-danger"></i> ${phone}</div>
                        <p class="small mb-1 text-dark"><b>ОТ:</b> ${o.Address_Start}<br><b>ДО:</b> ${o.Address_End}</p>
                        <div class="mb-2">${team}</div>
                        <div class="small text-secondary border-top pt-1 italic text-truncate">${o.Description || ''}</div>
                    </div>
                </div>`;
            }).join('');

            // LISTS
            document.getElementById('clientData').innerHTML = appData.clients.map(c => `<option value="${c.Name}"></option>`).join('');
            document.getElementById('o_service').innerHTML = appData.services.map(s => `<option value="${s.trim()}">${s.trim()}</option>`).join('');
            document.getElementById('teamPick').innerHTML = appData.employees.map(e => `<div class="col-4 mb-1 small"><input type="checkbox" class="team-chk" value="${e.ID_Emp}" id="t_${e.ID_Emp}"> <label for="t_${e.ID_Emp}">${e.Name}</label></div>`).join('');
            document.getElementById('clientTable').innerHTML = appData.clients.map(c => `<tr><td><b>${c.Name}</b></td><td>${c.Phone}</td><td><button class="btn btn-sm btn-light border" onclick='editClient(${JSON.stringify(c)})'><i class="fas fa-edit"></i></button></td></tr>`).join('');
            document.getElementById('empTable').innerHTML = appData.employees.map(e => `<tr><td><b>${e.Name}</b></td><td>${e.Email}</td><td><button class="btn btn-sm btn-light border" onclick='editEmp(${JSON.stringify(e)})'><i class="fas fa-edit"></i></button></td></tr>`).join('');
        }

        function showOrderDetails(o) {
            Swal.fire({
                title: o.Service,
                html: `<div class="text-start small">
                    <b>Клиент:</b> ${o.Client_ID} (${o.phone})<br>
                    <b>Адрес:</b> ${o.Address_Start} &rarr; ${o.Address_End}<br>
                    <b>Екип:</b> ${o.team}<br>
                    <b>Бележки:</b> ${o.Description || '-'}
                </div>`,
                confirmButtonText: 'Редактирай',
                showCancelButton: true,
                cancelButtonText: 'Затвори'
            }).then(r => { if(r.isConfirmed) editOrder(o); });
        }

        function editOrder(o) {
            document.getElementById('orderForm').reset();
            document.getElementById('o_id').value = o.ID_Order;
            document.getElementById('o_client').value = o.Client_ID;
