<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Местим всичко ERP - Professional Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f4f7f6; margin: 0; }
        h1, h2, h3, .sidebar, .btn, .fw-bold { font-family: 'Montserrat', sans-serif; }
        .sidebar { height: 100vh; background: #1a3c5a; color: white; position: fixed; width: 240px; z-index: 1000; }
        .sidebar a { color: white; text-decoration: none; padding: 15px 25px; display: block; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .sidebar a:hover { background: #244d73; }
        .content { margin-left: 240px; padding: 30px; min-height: 100vh; }
        #calendar { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); min-height: 700px; }
        .fc-event { cursor: pointer !important; }
        #loginScreen { height: 100vh; display: flex; align-items: center; justify-content: center; background: #1a3c5a; position: fixed; width: 100%; top:0; left:0; z-index: 9999; }
        #loader { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.9); display:none; align-items:center; justify-content:center; z-index:10000; flex-direction:column; }
        .online-dot { height: 10px; width: 10px; background-color: #2ecc71; border-radius: 50%; display: inline-block; margin-right: 5px; box-shadow: 0 0 5px #2ecc71; }
    </style>
</head>
<body>

    <div id="loader"><i class="fas fa-spinner fa-spin fa-3x text-primary mb-3"></i><span>Синхронизиране...</span></div>

    <div id="loginScreen">
        <div class="text-center p-5 shadow-lg rounded-4 bg-white" style="max-width: 400px; width: 90%;">
            <h3 class="fw-bold mb-4">Mestim ERP Admin</h3>
            <input type="email" id="logEmail" class="form-control mb-3 py-2 text-center" placeholder="Имейл">
            <input type="password" id="logPass" class="form-control mb-4 py-2 text-center" placeholder="Парола">
            <button class="btn btn-primary w-100 py-2 fw-bold shadow" onclick="tryLogin()">ВЛИЗАНЕ</button>
        </div>
    </div>

    <div id="mainApp" style="display:none;">
        <div class="sidebar">
            <div class="p-4 text-center"><h4>МЕСТИМ ВСИЧКО</h4><small id="uRole" class="badge bg-success"></small></div>
            <a onclick="showPage('dashboard')"><i class="fas fa-calendar-alt me-2"></i> График</a>
            <a onclick="showPage('orders-sec')"><i class="fas fa-truck me-2"></i> Поръчки</a>
            <a onclick="showPage('clients-sec')"><i class="fas fa-users me-2"></i> Клиенти</a>
            <a onclick="showPage('emps-sec')"><i class="fas fa-user-friends me-2"></i> Екип</a>
            <a onclick="showPage('payroll-sec')" id="link-payroll"><i class="fas fa-euro-sign me-2"></i> Заплати</a>
            <a onclick="showPage('resources-sec')"><i class="fas fa-link me-2"></i> Ресурси</a>
            <a onclick="logout()" class="text-danger mt-5"><i class="fas fa-sign-out-alt me-2"></i> Изход</a>
        </div>

        <div class="content">
            <section id="page-dashboard"><div class="d-flex justify-content-between mb-4"><h2>График</h2><button class="btn btn-success rounded-pill px-4" onclick="openOrderModal()">+ НОВА ПОРЪЧКА</button></div><div id="calendar"></div></section>
            
            <!-- PAYROLL SECTION WITH FINANCE DETAILS -->
            <section id="page-payroll-sec" style="display:none;">
                <h2>Заплати и Бонуси</h2>
                <div class="card p-3 shadow-sm"><table class="table align-middle"><thead><tr><th>Служител</th><th>Часове</th><th>Сума за плащане</th><th>Действие</th></tr></thead><tbody id="payrollTableBody"></tbody></table></div>
            </section>

            <!-- RESOURCES SECTION -->
            <section id="page-resources-sec" style="display:none;">
                <div class="d-flex justify-content-between mb-4"><h2>Ресурси и Бележки</h2><button class="btn btn-primary" onclick="openResModal()">+ ДОБАВИ</button></div>
                <div class="row" id="resourceList"></div>
            </section>

            <!-- OTHER TABLES -->
            <section id="page-orders-sec" style="display:none;"><div class="d-flex justify-content-between mb-4"><h2>Поръчки</h2><input type="text" class="form-control w-50 shadow-sm" placeholder="Търси..." onkeyup="filterTable('orderTable', this.value)"></div><div class="card p-3 shadow-sm"><table class="table table-hover" id="orderTable"><thead><tr><th>Дата</th><th>Клиент</th><th>Услуга</th><th>Адрес</th><th>Действие</th></tr></thead><tbody id="orderListBody"></tbody></table></div></section>
            <section id="page-clients-sec" style="display:none;"><div class="d-flex justify-content-between mb-4"><h2>Клиенти</h2><input type="text" class="form-control w-50" placeholder="Търси..." onkeyup="filterTable('clientTable', this.value)"></div><div class="card p-3 shadow-sm"><table class="table align-middle" id="clientTable"><thead><tr><th>Име</th><th>Телефон</th><th>Адрес</th><th>Действие</th></tr></thead><tbody id="clientListBody"></tbody></table></div></section>
            <section id="page-emps-sec" style="display:none;"><div class="d-flex justify-content-between mb-4"><h2>Екип статус</h2><button class="btn btn-primary" onclick="openEmpModal()">+ НОВ СЛУЖИТЕЛ</button></div><div id="empStatusList" class="row"></div></section>
        </div>
    </div>

    <!-- MODAL: ORDER -->
    <div class="modal fade" id="orderModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content p-4 shadow-lg border-0 rounded-4"><form id="orderForm"><input type="hidden" name="ID_Order" id="o_id"><h4 id="o_title" class="fw-bold mb-4">Поръчка</h4><div class="row mb-3"><div class="col-md-6"><label class="small fw-bold">Клиент</label><input list="clientData" id="o_client" class="form-control" required placeholder="Търси..."><datalist id="clientData"></datalist></div><div class="col-md-6"><label class="small fw-bold">Услуга</label><select name="Service" id="o_service" class="form-select"></select></div></div><div class="row mb-3"><div class="col-md-4"><label class="small fw-bold">Дата</label><input type="date" name="Date" id="o_date" class="form-control" required></div><div class="col-md-4"><label class="small fw-bold">Начало</label><input type="time" name="TimeStart" id="o_start" class="form-control" required></div><div class="col-md-4"><label class="small fw-bold">Край</label><input type="time" name="TimeEnd" id="o_end" class="form-control"></div></div><div class="row mb-3"><div class="col-md-6"><label class="small fw-bold">ОТ Адрес</label><input type="text" name="AddrStart" id="o_addr1" class="form-control" required></div><div class="col-md-6"><label class="small fw-bold">ДО Адрес</label><input type="text" name="AddrEnd" id="o_addr2" class="form-control" required></div></div><div class="card p-3 bg-light mb-3 border-0"><h6>Екип:</h6><div id="teamPick" class="row"></div></div><textarea name="Desc" id="o_desc" class="form-control mb-3" placeholder="Бележки..."></textarea><div class="d-flex gap-2"><button type="submit" class="btn btn-primary w-100 py-2">ЗАПАЗИ</button><button type="button" id="btnDeleteOrder" class="btn btn-outline-danger" style="display:none;" onclick="deleteItem('Order', document.getElementById('o_id').value)">ИЗТРИЙ</button></div></form></div></div></div>

    <!-- MODAL: RESOURCE -->
    <div class="modal fade" id="resourceModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content p-4 shadow-lg border-0 rounded-4"><form id="resourceForm"><input type="hidden" name="ID_Resource" id="r_id"><h4>Ресурс</h4><input type="text" name="Title" id="r_title" class="form-control mb-2" required placeholder="Заглавие"><input type="text" name="Link" id="r_link" class="form-control mb-2" placeholder="Линк"><textarea name="Notes" id="r_notes" class="form-control mb-3" placeholder="Бележки"></textarea><div class="d-flex gap-2"><button type="submit" class="btn btn-primary w-100">ЗАПАЗИ</button><button type="button" id="btnDeleteRes" class="btn btn-outline-danger" style="display:none;" onclick="deleteItem('Resource', document.getElementById('r_id').value)">ИЗТРИЙ</button></div></form></div></div></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/bg.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwA-q2ce8R0tB3EusmgR8Uy_M0W2dfAQLrVfb96CDLg8-56ZvNU9LMLtsExEgZ_YfNRpw/exec";
        const SERVICE_COLORS = { "Преместване": "#2ecc71", "Работа на екип": "#3498db", "Изхвърляне строителни": "#e67e22", "Изхвърляне мебели": "#95a5a6", "Транспорт": "#1abc9c", "Оглед": "#f1c40f", "Монтаж": "#e74c3c" };
        let appData = {}; let calendar;

        async function tryLogin() {
            const email = document.getElementById('logEmail').value.trim();
            const pass = document.getElementById('logPass').value.trim();
            if(!email || !pass) return;
            toggleLoader(true);
            try {
                const resp = await fetch(`${API_URL}?email=${email}&pass=${pass}`);
                const data = await resp.json();
                if(data.error) throw new Error(data.error);
                appData = data;
                localStorage.setItem('mestim_email', email); localStorage.setItem('mestim_pass', pass);
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
                renderAll();
                setTimeout(() => { if(calendar) { calendar.render(); calendar.updateSize(); } }, 300);
            } catch(e) { document.getElementById('loginError').innerText = "Грешен вход!"; toggleLoader(false); }
        }

        window.onload = () => { const e = localStorage.getItem('mestim_email'), p = localStorage.getItem('mestim_pass'); if(e && p) { tryLogin(); } };
        function logout() { localStorage.clear(); location.reload(); }

        function renderAll() {
            const isAdmin = appData.user.Role === "Admin";
            document.getElementById('uRole').innerText = appData.user.Role;
            if(!isAdmin) { document.getElementById('link-payroll').style.display = 'none'; }

            // CALENDAR
            const el = document.getElementById('calendar');
            if (calendar) calendar.destroy();
            calendar = new FullCalendar.Calendar(el, {
                initialView: 'dayGridMonth', locale: 'bg',
                headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,timeGridDay' },
                events: appData.orders.map(o => ({
                    title: `${o.Service} | ${o.Client_ID}`,
                    start: `${o.Date}T${o.Time_Start_Plan}`,
                    end: o.Time_End_Plan ? `${o.Date}T${o.Time_End_Plan}` : null,
                    color: SERVICE_COLORS[o.Service] || '#1a3c5a',
                    extendedProps: o
                })),
                eventClick: (i) => showOrderDetails(i.event.extendedProps.ID_Order)
            });
            calendar.render();

            // PAYROLL TABLE
            document.getElementById('payrollTableBody').innerHTML = appData.employees.map(e => `
                <tr><td><b>${e.Name}</b></td><td>${e.Total_Hours} ч.</td><td class="text-success fw-bold">${e.Total_Unpaid_Eur} €</td>
                <td><button class="btn btn-sm btn-outline-primary" onclick="viewEmployeeLogs('${e.ID_Emp}')">Корекции</button></td></tr>
            `).join('');

            // RESOURCES
            const adminLinks = `<div class="col-md-6 mb-3"><a href="https://docs.google.com/spreadsheets/d/1eYld8WuswC1gZMjl81JWecw7XyC0p1mGihSpBViZahg/edit" target="_blank" class="card p-4 resource-card text-center text-decoration-none shadow-sm"><i class="fas fa-table fa-2x mb-2 text-success"></i><h5>База Данни</h5></a></div><div class="col-md-6 mb-3"><a href="https://mestimworkspace-stack.github.io/mestim-vsichko-team/" target="_blank" class="card p-4 resource-card text-center text-decoration-none shadow-sm"><i class="fas fa-mobile-alt fa-2x mb-2 text-primary"></i><h5>Екип Панел</h5></a></div>`;
            document.getElementById('resourceList').innerHTML = adminLinks + (appData.resources || []).map(r => `<div class="col-md-6 mb-3"><div class="card p-4 resource-card" onclick="prepEdit('Resource','${r.ID_Resource}')"><h5>${r.Title}</h5><p class="small text-muted">${r.Notes || ''}</p></div></div>`).join('');

            document.getElementById('orderListBody').innerHTML = appData.orders.sort((a,b) => new Date(b.Date) - new Date(a.Date)).map(o => `<tr><td>${o.Date} ${o.Time_Start_Plan}</td><td><b>${o.Client_ID}</b></td><td>${o.Service}</td><td>${o.Address_Start}</td><td><button class="btn btn-sm btn-outline-primary" onclick="prepEdit('Order','${o.ID_Order}')"><i class="fas fa-edit"></i></button></td></tr>`).join('');
            document.getElementById('clientListBody').innerHTML = appData.clients.map(c => `<tr><td>${c.Name}</td><td>${c.Phone}</td><td>${c.Address_Main}</td><td><button class="btn btn-sm btn-outline-primary" onclick="prepEdit('Client','${c.ID_Client}')"><i class="fas fa-edit"></i></button></td></tr>`).join('');
            document.getElementById('empStatusList').innerHTML = appData.employees.map(e => `<div class="col-md-4 mb-3"><div class="card p-3 text-center border-0 shadow-sm h-100"><div>${e.isOnline ? '<span class="online-dot"></span> <b>РАБОТИ</b>' : '<small class="text-muted">Офлайн</small>'}</div><h5 class="m-0 fw-bold">${e.Name}</h5><button class="btn btn-sm btn-light border mt-2" onclick="prepEdit('Employee','${e.ID_Emp}')"><i class="fas fa-edit"></i></button></div></div>`).join('');
            
            document.getElementById('clientData').innerHTML = appData.clients.map(c => `<option value="${c.Name}"></option>`).join('');
            document.getElementById('o_service').innerHTML = appData.services.map(s => `<option value="${s.trim()}">${s.trim()}</option>`).join('');
            document.getElementById('teamPick').innerHTML = appData.employees.map(e => `<div class="col-4 small"><input type="checkbox" class="team-chk" value="${e.ID_Emp}" id="t_${e.ID_Emp}"> <label for="t_${e.ID_Emp}">${e.Name}</label></div>`).join('');
        }

        // FINANCE MODAL FUNCTIONS
        function viewEmployeeLogs(empId) {
            const logs = appData.workLogs.filter(l => String(l.Emp_ID) === String(empId) && l.Payment_Status === "Unpaid");
            let html = '<div class="list-group">';
            logs.forEach(l => {
                html += `<div class="list-group-item d-flex justify-content-between align-items-center">
                    <span>${l.Clock_In}</span>
                    <button class="btn btn-sm btn-primary" onclick="openFinanceModal('${l.ID_Log}')">Корекция</button>
                </div>`;
            });
            html += '</div>';
            Swal.fire({ title: 'Работни дни', html: html, showConfirmButton: false });
        }

        async function openFinanceModal(logId) {
            const l = appData.workLogs.find(x => String(x.ID_Log) === String(logId));
            const { value: v } = await Swal.fire({
                title: 'Бонуси и Глоби',
                html: `Шофьор: <input id="f-dr" class="swal2-input" value="${l.Driver_Bonus || 0}">` +
                      `Коорд: <input id="f-co" class="swal2-input" value="${l.Coord_Bonus || 0}">` +
                      `Бонус: <input id="f-ex" class="swal2-input" value="${l.Extra_Bonus || 0}">` +
                      `Глоба: <input id="f-fi" class="swal2-input" value="${l.Fine_Penalty || 0}">`,
                preConfirm: () => [document.getElementById('f-dr').value, document.getElementById('f-co').value, document.getElementById('f-ex').value, document.getElementById('f-fi').value]
            });
            if(v) {
                await send({ action: "updateFinance", logId: logId, driver: v[0], coord: v[1], bonus: v[2], fine: v[3] });
            }
        }

        function prepEdit(type, id) {
            const isAdmin = appData.user.Role === 'Admin';
            if(type === 'Order') {
                const o = appData.orders.find(x => String(x.ID_Order) === String(id));
                document.getElementById('orderForm').reset();
                document.getElementById('o_id').value = o.ID_Order;
                document.getElementById('o_client').value = o.Client_ID;
                document.getElementById('o_service').value = o.Service;
                document.getElementById('o_date').value = o.Date;
                document.getElementById('o_start').value = o.Time_Start_Plan;
                document.getElementById('o_end').value = o.Time_End_Plan;
                document.getElementById('o_addr1').value = o.Address_Start;
                document.getElementById('o_addr2').value = o.Address_End;
                document.getElementById('o_desc').value = o.Description;
                const cur = (appData.assignments || []).filter(a => String(a.Order_ID) === String(id)).map(a => String(a.Emp_ID));
                document.querySelectorAll('.team-chk').forEach(cb => cb.checked = cur.includes(cb.value));
                document.getElementById('btnDeleteOrder').style.display = isAdmin ? 'block' : 'none';
                new bootstrap.Modal(document.getElementById('orderModal')).show();
            } else if(type === 'Resource') {
                const r = appData.resources.find(x => String(x.ID_Resource) === String(id));
                document.getElementById('r_id').value = r.ID_Resource;
                document.getElementById('r_title').value = r.Title;
                document.getElementById('r_link').value = r.Link;
                document.getElementById('r_notes').value = r.Notes;
                document.getElementById('btnDeleteRes').style.display = 'block';
                new bootstrap.Modal(document.getElementById('resourceModal')).show();
            }
            // ... (аналогично за Client и Employee)
        }

        async function send(d) { toggleLoader(true); await fetch(API_URL, {method:'POST', mode:'no-cors', body:JSON.stringify(d)}); location.reload(); }
        async function deleteItem(t, id) { if(confirm('Изтриване?')) { await send({action: "delete"+t, id: id}); } }
        function showPage(p) { document.querySelectorAll('section').forEach(s => s.style.display = 'none'); document.getElementById('page-'+p).style.display = 'block'; if(calendar) { calendar.render(); calendar.updateSize(); } }
        function filterTable(tid, v) { const val = v.toLowerCase(); document.querySelectorAll(`#${tid} tbody tr`).forEach(tr => tr.style.display = tr.innerText.toLowerCase().includes(val) ? '' : 'none'); }
        function toggleLoader(s) { document.getElementById('loader').style.display = s ? 'flex' : 'none'; }
        function openOrderModal() { document.getElementById('orderForm').reset(); document.getElementById('o_id').value = ""; document.getElementById('btnDeleteOrder').style.display="none"; new bootstrap.Modal(document.getElementById('orderModal')).show(); }
        function openResModal() { document.getElementById('resourceForm').reset(); document.getElementById('r_id').value = ""; document.getElementById('btnDeleteRes').style.display="none"; new bootstrap.Modal(document.getElementById('resourceModal')).show(); }
    </script>
</body>
</html>
