<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP OFFICE - Местим Всичко</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        h1, h2, h3 { font-family: 'Montserrat', sans-serif; }
        .sidebar-btn { transition: all 0.2s; border-left: 4px solid transparent; }
        .sidebar-btn.active { background: #1e293b; border-left: 4px solid #3b82f6; color: white; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 50; }
        .modal.active { display: flex; }
    </style>
</head>
<body>

    <div class="flex min-h-screen">
        <!-- SIDEBAR -->
        <div class="w-64 bg-slate-900 text-slate-300 p-6 shrink-0">
            <h1 class="text-white text-xl font-bold mb-10 tracking-tight">MESTIM <span class="text-blue-500">ERP</span></h1>
            <nav class="space-y-2">
                <button onclick="changeTab('Clients', this)" class="sidebar-btn active w-full text-left p-3 rounded-lg hover:bg-slate-800">👥 Клиенти</button>
                <button onclick="changeTab('Employees', this)" class="sidebar-btn w-full text-left p-3 rounded-lg hover:bg-slate-800">👷 Служители</button>
                <button onclick="changeTab('Resources', this)" class="sidebar-btn w-full text-left p-3 rounded-lg hover:bg-slate-800">📚 Ресурси</button>
            </nav>
        </div>

        <!-- MAIN CONTENT -->
        <main class="flex-1 p-8">
            <div class="max-w-6xl mx-auto">
                <header class="flex justify-between items-end mb-8">
                    <div>
                        <p class="text-slate-500 text-sm uppercase tracking-widest font-semibold">Управление</p>
                        <h2 id="section-title" class="text-4xl font-extrabold text-slate-800">Клиенти</h2>
                    </div>
                    <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg shadow-blue-200 transition-all transform hover:-translate-y-1">
                        + ДОБАВИ НОВ
                    </button>
                </header>

                <!-- TABLE CARD -->
                <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50 border-b border-slate-100">
                                <tr id="table-headers">
                                    <th class="p-5 text-slate-400 font-medium italic text-sm text-center">Зареждане на данни...</th>
                                </tr>
                            </thead>
                            <tbody id="table-body" class="divide-y divide-slate-50">
                                <!-- Данните ще се заредят тук -->
                            </tbody>
                        </table>
                    </div>
                    <div id="no-data" class="hidden p-20 text-center">
                        <p class="text-slate-400 text-lg">Няма намерени записи в тази секция.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL FORM -->
    <div id="entryModal" class="modal p-4">
        <div class="bg-white rounded-3xl w-full max-w-md p-8 shadow-2xl overflow-hidden relative">
            <h3 id="modal-title" class="text-2xl font-bold text-slate-800 mb-6">Нов запис</h3>
            <form id="dataForm" onsubmit="handleSave(event)" class="space-y-4">
                <div id="form-fields" class="space-y-4">
                    <!-- Полетата се генерират автоматично спрямо таба -->
                </div>
                <div class="flex gap-3 mt-8">
                    <button type="button" onclick="closeModal()" class="flex-1 bg-slate-100 text-slate-600 py-3 rounded-xl font-bold hover:bg-slate-200">Отказ</button>
                    <button type="submit" id="saveBtn" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 shadow-lg shadow-blue-200">Запази</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- КОНФИГУРАЦИЯ ---
        const API_URL = 'https://script.google.com/macros/s/AKfycbwAKelVaD8tyPQFtIroMFbEwGlxJhaomGWsTKw_JlAjMyhjwQ2oqy5pBnhD_S38UiAL6Q/exec'; // СЛОЖИ ТВОЯ ЛИНК ТУК!
        let currentTab = 'Clients';

        // Функция за смяна на табовете
        async function changeTab(tabName, element) {
            console.log("Смяна на таб към:", tabName);
            currentTab = tabName;
            
            // Визуална промяна на бутоните
            document.querySelectorAll('.sidebar-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            
            // Промяна на заглавието
            document.getElementById('section-title').innerText = element.innerText.split(' ')[1];
            
            // Зареждане на данни
            await loadData();
        }

        // Зареждане на данни от Google Sheets
        async function loadData() {
            const tableHeaders = document.getElementById('table-headers');
            const tableBody = document.getElementById('table-body');
            const noData = document.getElementById('no-data');

            tableBody.innerHTML = '<tr><td colspan="10" class="p-10 text-center text-slate-400 italic">Свързване с базата данни...</td></tr>';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'GET_DATA', tab: currentTab })
                });
                const result = await response.json();

                if (result.success && result.data.length > 0) {
                    noData.classList.add('hidden');
                    const headers = Object.keys(result.data[0]);
                    
                    // Попълни хедърите
                    tableHeaders.innerHTML = headers.map(h => `<th class="p-5 text-slate-500 font-bold text-sm uppercase">${h.replace('_', ' ')}</th>`).join('');
                    
                    // Попълни редовете
                    tableBody.innerHTML = result.data.map(row => `
                        <tr class="hover:bg-blue-50/50 transition-colors group">
                            ${headers.map(h => `<td class="p-5 text-slate-600 text-sm border-b border-slate-50">${row[h] || '-'}</td>`).join('')}
                        </tr>
                    `).join('');
                } else {
                    tableHeaders.innerHTML = '';
                    tableBody.innerHTML = '';
                    noData.classList.remove('hidden');
                }
            } catch (error) {
                console.error("Грешка:", error);
                tableBody.innerHTML = '<tr><td colspan="10" class="p-10 text-center text-red-500 font-bold">ГРЕШКА: Провери API линка в кода!</td></tr>';
            }
        }

        // Управление на Модала (Формата)
        function openModal() {
            const formFields = document.getElementById('form-fields');
            document.getElementById('modal-title').innerText = "Добави в " + currentTab;
            
            // Генериране на полета спрямо таба
            let fields = '';
            if(currentTab === 'Clients') {
                fields = `
                    <input type="text" name="Name" placeholder="Име на клиент" class="w-full p-4 bg-slate-50 border-0 rounded-xl focus:ring-2 focus:ring-blue-500" required>
                    <input type="text" name="Phone" placeholder="Телефон" class="w-full p-4 bg-slate-50 border-0 rounded-xl focus:ring-2 focus:ring-blue-500" required>
                    <input type="text" name="Address_Main" placeholder="Основен адрес" class="w-full p-4 bg-slate-50 border-0 rounded-xl focus:ring-2 focus:ring-blue-500">
                `;
            } else if(currentTab === 'Employees') {
                fields = `
                    <input type="text" name="Name" placeholder="Име на служител" class="w-full p-4 bg-slate-50 border-0 rounded-xl focus:ring-2 focus:ring-blue-500" required>
                    <input type="email" name="Email" placeholder="Имейл" class="w-full p-4 bg-slate-50 border-0 rounded-xl focus:ring-2 focus:ring-blue-500" required>
                    <input type="text" name="Password" placeholder="Парола" class="w-full p-4 bg-slate-50 border-0 rounded-xl focus:ring-2 focus:ring-blue-500" required>
                    <select name="Role" class="w-full p-4 bg-slate-50 border-0 rounded-xl focus:ring-2 focus:ring-blue-500">
                        <option value="Employee">Employee</option>
                        <option value="Manager">Manager</option>
                        <option value="Admin">Admin</option>
                    </select>
                `;
            }
            
            formFields.innerHTML = fields;
            document.getElementById('entryModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('entryModal').classList.remove('active');
        }

        // Запис на данни
        async function handleSave(e) {
            e.preventDefault();
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.innerText = "Записване...";
            saveBtn.disabled = true;

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            
            // Добавяме ID автоматично (просто за теста)
            data.id = Date.now(); 

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ 
                        action: 'SAVE_DATA', 
                        tab: currentTab,
                        data: data
                    })
                });
                const result = await response.json();
                if(result.success) {
                    closeModal();
                    loadData();
                }
            } catch (error) {
                alert("Грешка при запис!");
            } finally {
                saveBtn.innerText = "Запази";
                saveBtn.disabled = false;
            }
        }

        // Първоначално стартиране
        window.onload = () => loadData();
    </script>
</body>
</html>
