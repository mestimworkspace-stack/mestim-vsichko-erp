<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mestim Vsichko ERP Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; }
        .sidebar { height: 100vh; background: #1a3c5a; color: white; position: fixed; width: 250px; z-index: 1000; }
        .sidebar a { color: white; text-decoration: none; padding: 15px 25px; display: block; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .sidebar a:hover { background: #244d73; }
        .content { margin-left: 250px; padding: 30px; min-height: 100vh; }
        #calendar { background: white; padding: 20px; border-radius: 12px; height: 750px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .order-card { border-left: 6px solid #1a3c5a; transition: 0.3s; }
        .team-badge { background: #e9ecef; color: #1a3c5a; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; margin-right: 5px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="p-4 text-center"><h4 class="fw-bold">МЕСТИМ ВСИЧКО</h4></div>
        <a onclick="showSection('dashboard')"><i class="fas fa-calendar-alt me-2"></i> График</a>
        <a onclick="showSection('orders-sec')"><i class="fas fa-truck me-2"></i> Поръчки</a>
        <a onclick="showSection('clients-sec')"><i class="fas fa-users me-2"></i> Клиенти</a>
        <a onclick="showSection('emps-sec')"><i class="fas fa-user-friends me-2"></i> Екип</a>
    </div>

    <div class="content">
        <section id="dashboard">
            <div class="d-flex justify-content-between mb-4"><h2>График</h2><button class="btn btn-success rounded-pill px-4" onclick="openOrderModal()">+ НОВА ПОРЪЧКА</button></div>
            <div id="calendar"></div>
        </section>

        <section id="orders-sec" style="display:none;">
            <div class="d-flex justify-content-between mb-4"><h2>Поръчки</h2><input type="text" class="form-control w-50" placeholder="Търси..." onkeyup="filterOrders(this.value)"></div>
            <div id="orderList" class="row"></div>
        </section>

        <section id="clients-sec" style="display:none;">
            <h2>Клиенти</h2>
            <div class="card p-3"><table class="table"><thead><tr><th>Име</th><th>Телефон</th></tr></thead><tbody id="clientTable"></tbody></table></div>
        </section>

        <section id="emps-sec" style="display:none;">
            <h2>Служители</h2>
            <div class="card p-3"><table class="table"><thead><tr><th>Име</th><th>Email</th></tr></thead><tbody id="empTable"></tbody></table></div>
        </section>
    </div>

    <!-- MODAL: ORDER FORM (Add/Edit) -->
    <div class="modal fade" id="orderModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content p-4">
        <form id="orderForm">
            <input type="hidden" name="ID_Order" id="f_id">
            <h4 id="modalTitle" class="mb-4 text-primary">Нова поръчка</h4>
            <div class="row mb-3">
                <div class="col-md-6"><label>Клиент</label><input list="clientData" id="f_client" class="form-control" required><datalist id="clientData"></datalist></div>
                <div class="col-md-6"><label>Дата</label><input type="date" name="Date" id="f_date" class="form-control" required></div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6"><label>Начало</label><input type="time" name="TimeStart" id="f_start" class="form-control" required></div>
                <div class="col-md-6"><label>Край</label><input type="time" name="TimeEnd" id="f_end" class="form-control"></div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6"><label>ОТ Адрес</label><input type="text" name="AddrStart" id="f_addr1" class="form-control" required></div>
                <div class="col-md-6"><label>ДО Адрес</label><input type="text" name="AddrEnd" id="f_addr2" class="form-control" required></div>
            </div>
            <div class="card p-3 bg-light mb-3"><h6>Екип:</h6><div id="teamPick" class="row"></div></div>
            <div class="row mb-3">
                <div class="col-md-6"><label>Кола 1</label><input type="text" name="Vehicle1" id="f_v1" class="form-control"></div>
                <div class="col-md-6"><label>Кола 2</label><input type="text" name="Vehicle2" id="f_v2" class="form-control"></div>
            </div>
            <textarea name="Desc" id="f_desc" class="form-control mb-3" placeholder="Описание..."></textarea>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">ЗАПАЗИ ПРОМЕНИТЕ</button>
        </form>
    </div></div></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/bg.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwA-q2ce8R0tB3EusmgR8Uy_M0W2dfAQLrVfb96CDLg8-56ZvNU9LMLtsExEgZ_YfNRpw/exec";
        let appData = { employees: [], clients: [], orders: [], assignments: [] };
        let calendar;

        async function init() {
            const resp = await fetch(API_URL);
            appData = await resp.json();
            renderAll();
        }

        function renderAll() {
            // Calendar
            if (calendar) calendar.destroy();
            calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
                initialView: 'dayGridMonth', locale: 'bg',
                events: appData.orders.map(o => ({ title: `${o.Time_Start_Plan} | ${o.Client_ID}`, start: `${o.Date}T${o.Time_Start_Plan}`, color: '#1a3c5a', extendedProps: o })),
                eventClick: (info) => showOrderDetails(info.event.extendedProps)
            });
            calendar.render();

            // Orders List
            document.getElementById('orderList').innerHTML = appData.orders.map(o => {
                const team = appData.assignments.filter(a => a.Order_ID == o.ID_Order).map(a => {
                    const e = appData.employees.find(emp => emp.ID_Emp == a.Emp_ID);
                    return e ? `<span class="team-badge">${e.Name}</span>` : '';
                }).join('');

                return `
                <div class="col-md-6 mb-3 order-item" data-search="${o.Client_ID} ${o.Address_Start}">
                    <div class="card p-3 order-card h-100">
                        <div class="d-flex justify-content-between mb-2"><b>${o.Date} | ${o.Time_Start_Plan}</b><button class="btn btn-sm btn-outline-primary" onclick='editOrder(${JSON.stringify(o)})'><i class="fas fa-edit"></i></button></div>
                        <h5 class="text-primary mb-1">${o.Client_ID}</h5>
                        <p class="small mb-1 text-muted"><b>ОТ:</b> ${o.Address_Start}<br><b>ДО:</b> ${o.Address_End}</p>
                        <div class="mb-2">${team}</div>
                        <p class="small border-top pt-2 mb-0 italic text-secondary">${o.Description || 'Няма описание'}</p>
                    </div>
                </div>`;
            }).join('');

            // Rest
            document.getElementById('teamPick').innerHTML = appData.employees.map(e => `<div class="col-4 small"><input type="checkbox" class="team-chk" value="${e.ID_Emp}"> ${e.Name}</div>`).join('');
            document.getElementById('clientData').innerHTML = appData.clients.map(c => `<option value="${c.Name}"></option>`).join('');
            document.getElementById('clientTable').innerHTML = appData.clients.map(c => `<tr><td>${c.Name}</td><td>${c.Phone}</td></tr>`).join('');
            document.getElementById('empTable').innerHTML = appData.employees.map(e => `<tr><td>${e.Name}</td><td>${e.Email}</td></tr>`).join('');
        }

        function showOrderDetails(o) {
            Swal.fire({
                title: 'Детайли за поръчка #' + o.ID_Order,
                html: `<div class="text-start small">
                    <b>Клиент:</b> ${o.Client_ID}<br>
                    <b>Адрес:</b> ${o.Address_Start} -> ${o.Address_End}<br>
                    <b>Описание:</b> ${o.Description}<br>
                    <b>Автомобили:</b> ${o.Vehicle_1 || '-'} / ${o.Vehicle_2 || '-'}
                </div>`,
                confirmButtonText: 'Затвори'
            });
        }

        function editOrder(o) {
            document.getElementById('f_id').value = o.ID_Order;
            document.getElementById('f_client').value = o.Client_ID;
            document.getElementById('f_date').value = o.Date;
            document.getElementById('f_start').value = o.Time_Start_Plan;
            document.getElementById('f_end').value = o.Time_End_Plan;
            document.getElementById('f_addr1').value = o.Address_Start;
            document.getElementById('f_addr2').value = o.Address_End;
            document.getElementById('f_v1').value = o.Vehicle_1;
            document.getElementById('f_v2').value = o.Vehicle_2;
            document.getElementById('f_desc').value = o.Description;
            document.getElementById('modalTitle').innerText = "Редактиране на поръчка #" + o.ID_Order;

            // Check team
            document.querySelectorAll('.team-chk').forEach(cb => {
                cb.checked = appData.assignments.some(a => a.Order_ID == o.ID_Order && a.Emp_ID == cb.value);
            });

            new bootstrap.Modal(document.getElementById('orderModal')).show();
        }

        function openOrderModal() {
            document.getElementById('orderForm').reset();
            document.getElementById('f_id').value = "";
            document.getElementById('modalTitle').innerText = "Нова поръчка";
            new bootstrap.Modal(document.getElementById('orderModal')).show();
        }

        document.getElementById('orderForm').onsubmit = async (e) => {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(e.target));
            data.action = document.getElementById('f_id').value ? "editOrder" : "addOrder";
            data.ClientName = document.getElementById('f_client').value;
            data.TeamIds = Array.from(document.querySelectorAll('.team-chk:checked')).map(c => c.value);
            Swal.fire({title:'Записване...', didOpen:()=>Swal.showLoading()});
            await fetch(API_URL, {method:'POST', mode:'no-cors', body:JSON.stringify(data)});
            location.reload();
        };

        function showSection(id) {
            document.querySelectorAll('section').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'block';
            if(calendar) calendar.updateSize();
        }

        function filterOrders(val) {
            const v = val.toLowerCase();
            document.querySelectorAll('.order-item').forEach(el => el.style.display = el.getAttribute('data-search').toLowerCase().includes(v) ? 'block' : 'none');
        }

        window.onload = init;
    </script>
</body>
</html>
